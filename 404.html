<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap">
<style>
  :root{--paper:#F4EFE6;--ink:#1B1830;--muted:#6B6880;--acc:#6D3BE0}
  @media (prefers-color-scheme:dark){:root{--paper:#0E0C1C;--ink:#F4EFE6;--muted:#A9A5BD;--acc:#A78BFA}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:24px}
  main{max-width:520px;text-align:left}
  .k{font:500 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
  h1{font:700 clamp(40px,11vw,72px)/.95 'Archivo Narrow',Inter,sans-serif;letter-spacing:-.01em;margin:0 0 18px}
  p{font-size:16px;line-height:1.6;color:var(--muted);margin:0 0 26px}
  a{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;font-weight:500;padding:14px 20px;border-radius:8px}
  a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="k">scene missing · 404</p>
  <h1>Nothing was shot at this address.</h1>
  <p>The page you were after has moved or never existed. The drafting table is still open.</p>
